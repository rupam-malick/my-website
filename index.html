<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 48px 32px;
      max-width: 600px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    .badge {
      display: inline-block;
      background: #f59e0b;
      color: #0f172a;
      font-weight: 700;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 14px;
      border-radius: 9999px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: 2.25rem;
      font-weight: 800;
      margin-bottom: 12px;
      color: #ffffff;
    }

    p {
      color: #94a3b8;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .progress-bar-container {
      background: #334155;
      border-radius: 9999px;
      height: 10px;
      overflow: hidden;
      margin-bottom: 32px;
    }

    .progress-bar {
      width: 70%;
      height: 100%;
      background: linear-gradient(90deg, #38bdf8, #818cf8);
      border-radius: 9999px;
      animation: pulse 2s infinite ease-in-out;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .time-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 12px 8px;
    }

    .time-val {
      font-size: 1.5rem;
      font-weight: 700;
      color: #38bdf8;
    }

    .time-label {
      font-size: 0.75rem;
      text-transform: uppercase;
      color: #64748b;
      margin-top: 4px;
    }

    .contact {
      font-size: 0.9rem;
      color: #64748b;
    }

    .contact a {
      color: #38bdf8;
      text-decoration: none;
    }

    .contact a:hover {
      text-decoration: underline;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>

  <main class="container">
    <span class="badge">Maintenance Mode</span>
    <h1>We're Rebuilding</h1>
    <p>We are currently fine-tuning our code, improving design, and preparing exciting updates. We will be back shortly!</p>

    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>

    <div class="countdown">
      <div class="time-box">
        <div class="time-val" id="days">00</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-box">
        <div class="time-val" id="hours">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-box">
        <div class="time-val" id="minutes">00</div>
        <div class="time-label">Mins</div>
      </div>
      <div class="time-box">
        <div class="time-val" id="seconds">00</div>
        <div class="time-label">Secs</div>
      </div>
    </div>

    <div class="contact">
      Need urgent support? Reach us at <a href="mailto:contact@yourdomain.com">contact@yourdomain.com</a>
    </div>
  </main>

  <script>
    // Set target date to 5 days from now (adjust as needed)
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 5);

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, "0");
      document.getElementById("hours").innerText = String(hours).padStart(2, "0");
      document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
      document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
