<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Oops! Website Under Construction</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      /* Use a calm, light blue derived from the image */
      background: #c3dafb;
      color: #0f172a;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .container {
      background: #ffffff;
      border-radius: 20px;
      padding: 40px;
      max-width: 650px; /* Slightly wider to match image aspect */
      width: 100%;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
    }

    /* Construction Image Styling */
    .constuction-graphic {
      max-width: 100%;
      height: auto;
      margin-bottom: 30px;
      border-radius: 12px;
      display: block; /* Center within the flex parent if needed */
      margin-left: auto;
      margin-right: auto;
    }

    p.main-desc {
      color: #64748b;
      font-size: 1rem;
      line-height: 1.6;
      margin-bottom: 32px;
      font-weight: 500; /* For clarity */
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
      margin-bottom: 32px;
    }

    .time-box {
      /* Deep slate color for contrast against white card */
      background: #1e293b;
      border-radius: 12px;
      padding: 16px 8px;
    }

    .time-val {
      font-size: 1.75rem;
      font-weight: 800;
      /* Orange accent from the image cones */
      color: #f97316;
    }

    .time-label {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #cbd5e1;
      margin-top: 6px;
    }

    .contact {
      font-size: 0.95rem;
      color: #94a3b8;
    }

    .contact a {
      color: #f97316; /* matching orange */
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <main class="container">
    <!-- Image integration -->
    <img src="thumbnails/construction-landing-page-template_23-2148170362.avif" alt="Adorable kittens at an 'OOPS! Website Under Construction' site." class="constuction-graphic">
    
    <p class="main-desc">Our team (TECH_TITANS) is working hard on exciting updates. We are fine-tuning our code and preparing to launch. We will be back shortly!</p>

    <div class="countdown">
      <div class="time-box">
        <div class="time-val" id="days">00</div>
        <div class="time-label">Days</div>
      </div>
      <div class="time-box">
        <div class="time-val" id="hours">00</div>
        <div class="time-label">Hours</div>
      </div>
      <div class="time-box">
        <div class="time-val" id="minutes">00</div>
        <div class="time-label">Mins</div>
      </div>
      <div class="time-box">
        <div class="time-val" id="seconds">00</div>
        <div class="time-label">Secs</div>
      </div>
    </div>

    <div class="contact">
      Questions? Reach us at <a href="https://discord.gg/QxgEvTy2M">Lord_Rupam.com</a>
    </div>
  </main>

  <script>
    // Target date set to 5 days from now
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 5);

    function updateCountdown() {
      const now = new Date().getTime();
      const difference = targetDate - now;

      if (difference <= 0) {
        document.getElementById("days").innerText = "00";
        document.getElementById("hours").innerText = "00";
        document.getElementById("minutes").innerText = "00";
        document.getElementById("seconds").innerText = "00";
        // Optionally add back-online logic here
        return;
      }

      const days = Math.floor(difference / (1000 * 60 * 60 * 24));
      const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
      const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((difference % (1000 * 60)) / 1000);

      document.getElementById("days").innerText = String(days).padStart(2, "0");
      document.getElementById("hours").innerText = String(hours).padStart(2, "0");
      document.getElementById("minutes").innerText = String(minutes).padStart(2, "0");
      document.getElementById("seconds").innerText = String(seconds).padStart(2, "0");
    }

    setInterval(updateCountdown, 1000);
    updateCountdown();
  </script>
</body>
</html>
